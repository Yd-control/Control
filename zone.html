<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<link rel="icon" href="app-icon-192.png">
<style>
:root{--bg:#0a0f1f;--c1:#141b33;--c2:#1c2547;--tx:#eef1fb;--mu:#9aa5c8;--ac:#5ee6d4;--pu:#9a7cff;--or:#f0a93b;--bd:#27315a}
:root[data-t=light]{--bg:#f4f6fb;--c1:#fff;--c2:#eef1fb;--tx:#16203d;--mu:#5a6584;--ac:#0e9f8f;--pu:#6a4bd6;--or:#c47a10;--bd:#d5dbee}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.7 system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;padding-bottom:calc(80px + env(safe-area-inset-bottom,0px))}
header{padding:calc(env(safe-area-inset-top,0px) + 12px) 16px 12px;display:flex;align-items:center;gap:12px;border-bottom:1px solid var(--bd);background:var(--c1);position:sticky;top:0;z-index:5}
header .t{flex:1}header b{display:block;font-size:17px}header small{color:var(--mu);font-size:12px}
.ib{border:1px solid var(--bd);background:var(--c2);color:var(--tx);border-radius:12px;padding:8px 12px;font:inherit;cursor:pointer;text-decoration:none}
main{max-width:760px;margin:0 auto;padding:14px}
.card{background:var(--c1);border:1px solid var(--bd);border-radius:18px;padding:16px;margin:12px 0}
.card h2{margin:0 0 8px;font-size:18px}.mu{color:var(--mu);font-size:14px}
input,select,textarea{width:100%;background:var(--bg);color:var(--tx);border:1px solid var(--bd);border-radius:12px;padding:11px;font:inherit;margin:4px 0}
textarea{min-height:84px}label.l{display:block;color:var(--mu);font-size:13px;margin-top:8px}
.btn{border:0;background:var(--ac);color:#06201c;border-radius:12px;padding:11px 16px;font:700 15px inherit;font-family:inherit;cursor:pointer;margin:4px 0}
.btn.g{background:var(--c2);color:var(--tx);border:1px solid var(--bd)}.btn.r{background:#3a1620;color:#ff9aa8;border:1px solid #6a2434}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.row>*{flex:1}
.it{border-bottom:1px dashed var(--bd);padding:10px 0}.it:last-child{border:0}
.tag{display:inline-block;font-size:12px;border-radius:999px;padding:1px 10px;background:var(--c2);border:1px solid var(--bd);color:var(--mu);margin-inline-start:6px}
details{border:1px solid var(--bd);border-radius:14px;margin:10px 0;background:var(--c1)}summary{padding:12px 14px;font-weight:700;cursor:pointer}details>div{padding:0 14px 14px}
.chk{display:flex;flex-wrap:wrap;gap:6px}.chk label{border:1px solid var(--bd);background:var(--c2);border-radius:999px;padding:5px 12px;font-size:14px;cursor:pointer}.chk input{display:none}.chk input:checked+span{color:var(--ac);font-weight:700}.chk label:has(input:checked){border-color:var(--ac)}
nav{position:fixed;bottom:0;inset-inline:0;background:var(--c1);border-top:1px solid var(--bd);display:flex;padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px));z-index:6}
nav button{flex:1;border:0;background:none;color:var(--mu);font:inherit;font-size:12px;padding:6px 2px;cursor:pointer}nav button b{display:block;font-size:20px}nav button.on{color:var(--ac);font-weight:700}
.bx{position:fixed;inset:0;background:#000a;z-index:20;display:flex;align-items:flex-end;justify-content:center}.bx>div{background:var(--c1);width:100%;max-width:760px;border-radius:22px 22px 0 0;padding:18px;max-height:90vh;overflow:auto}
#pv{position:fixed;inset:0;background:#fff;color:#000;z-index:30;overflow:auto;padding:12px;display:none}
#pv .bar{position:sticky;top:0;background:#fff;padding:6px 0;display:flex;gap:8px;z-index:2}
#pv table{width:100%;table-layout:fixed;word-break:break-word;border-collapse:collapse;margin:10px 0;font-size:13px}#pv td,#pv th{border:1px solid #444;padding:5px 7px;vertical-align:top;text-align:right}#pv th{background:#e8edf7}#pv table:not(.ph) th:first-child{width:22%}
#pv h1,#pv h2{text-align:center;margin:6px 0}#pv h1{font-size:18px}#pv h2{font-size:15px}#pv .m{text-align:center;font-size:12px}
@media print{html,body{background:#fff!important;padding:0!important;margin:0!important;min-height:0!important}body>*:not(#pv){display:none!important}#pv{position:static;display:block!important;padding:0}#pv .bar{display:none}@page{size:A4;margin:12mm}}
</style></head><body>
<header><a class="ib" href="home.html">← مدرستي</a><div class="t"><b>my zone</b><small>مساحة المعلم · محلي على جهازك</small></div><button class="ib" id="thm">☀️</button></header>
<main id="m"></main>
<nav id="nv"></nav>
<div id="pv"></div>
<script>
const $=s=>document.querySelector(s),esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const LS=(k,d)=>{try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch(e){return d}};
const SV=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v));return true}catch(e){alert('تعذر الحفظ');return false}};
const uid=()=>Math.random().toString(36).slice(2,9);
let th=LS('ms_th','dark');const setTh=()=>{document.documentElement.dataset.t=th;$('#thm').textContent=th==='dark'?'☀️':'🌙'};setTh();
$('#thm').onclick=()=>{th=th==='dark'?'light':'dark';SV('ms_th',th);setTh()};
/* ===== الثوابت ===== */
const PH=[['engage','التهيئة واستدعاء المعرفة السابقة'],['investigate','الاستقصاء وبناء الفكرة'],['explain','النمذجة والتوضيح'],['practice','التطبيق والممارسة'],['assess','التقويم الختامي والغلق']];
const MIN={35:[4,7,9,11,4],40:[4,8,10,14,4],45:[5,9,12,14,5],50:[5,10,13,17,5],60:[6,12,16,20,6]};
const OPT={sciencePractices:['طرح الأسئلة وتحديد المشكلات','تطوير واستخدام النماذج','تخطيط وتنفيذ التحقيقات','تحليل وتفسير البيانات','استخدام الرياضيات والتفكير الحاسوبي','بناء التفسيرات وتصميم الحلول','الانخراط في النقاش القائم على الأدلة','الحصول على المعلومات وتقييمها ومشاركتها'],
scientificMethodSteps:['القيام بملاحظة','طرح سؤال بحثي','جمع المعلومات الخلفية والقيام بالبحث','تكوين فرضية','صياغة توقع','تخطيط التجربة (تصميم التحقيق وتحديد المتغيرات)','إجراء التجربة','جمع وتسجيل البيانات','التوصل إلى استنتاجات استنادًا إلى الأدلة','مشاركة النتائج والاستنتاجات','التفكير واقتراح الخطوات التالية أو التحقيقات الإضافية','تحليل وتفسير وتقييم البيانات'],
higherOrderSkills:['تحليل','تقييم','تبرير','استدلال','تكوين فرضية','إقامة روابط','استخلاص استنتاجات','تلخيص المعلومات','تصميم الحلول','الدفاع عن وجهة نظر','بناء تفسير'],
competencies:['التفكير النقدي','التعاون','التواصل','المرونة والقدرة على التكيف','التفكير الإبداعي','الابتكار','ريادة الأعمال','الإنتاجية','المساءلة','القيادة','المسؤولية','الهوية الثقافية','المبادرة والتوجه الذاتي','المرونة النفسية والتنظيم العاطفي','المهارات الاجتماعية والثقافية'],
crossCurricularLinks:['الكفاءة الرقمية','الحساب','الاستدامة','القرائية','الذكاء الاصطناعي','الدراسات الاجتماعية'],
seatingArrangement:['فردي','ثنائي','مجموعات (نفس المستوى)','مجموعات (مستويات مختلفة)','محطات عمل (دوران)','مرن','شكل حرف U']};
const OPTN={sciencePractices:'ممارسات العلوم والهندسة',scientificMethodSteps:'خطوات الطريقة العلمية',higherOrderSkills:'مهارات التفكير العليا',competencies:'مهارات القرن 21',crossCurricularLinks:'الروابط العابرة للمواد'};
/* ===== نموذج الخطة ===== */
const blank=()=>({id:uid(),ts:Date.now(),teacher:LS('ms_zone_prof',{}).teacher||'',subject:LS('ms_zone_prof',{}).subject||'',grade:'',track:'',section:'',date:new Date().toISOString().slice(0,10),dur:45,title:'',unit:'',secTitle:'',
outcomes:'',prior:'',objectives:'',misc:'',vocab:'',chk:{},uae:'',resources:'',materials:'',questions:'',
ph:PH.map(()=>({t:'',l:'',s:'',q:'',e:''})),as:{d:'',f:'',p:'',w:'',q:'',s:''},lang:'',diff:'',hw:'',support:'',seat:'',refl:'',next:''});
let plans=LS('ms_zone_plans',[]),cur=null,tab='plan';
const TABS=[['plan','التحضير','📝'],['test','الاختبارات','📄'],['rem','العلاجية والهمم','🤝']];
function nav(){$('#nv').innerHTML=TABS.map(t=>`<button data-t="${t[0]}" class="${tab===t[0]?'on':''}"><b>${t[2]}</b>${t[1]}</button>`).join('')}
$('#nv').onclick=e=>{const b=e.target.closest('button');if(!b)return;tab=b.dataset.t;render();scrollTo(0,0)};
/* ===== الواجهة ===== */
const fld=(k,lab,ph,rows)=>`<label class="l">${lab}</label>${rows?`<textarea data-k="${k}" placeholder="${esc(ph||'')}">${esc(get(k))}</textarea>`:`<input data-k="${k}" value="${esc(get(k))}" placeholder="${esc(ph||'')}">`}`;
const get=k=>{const p=k.split('.');let o=cur;for(const x of p)o=o==null?'':o[x];return o==null?'':o};
const setv=(k,v)=>{const p=k.split('.');let o=cur;for(let i=0;i<p.length-1;i++)o=o[p[i]];o[p[p.length-1]]=v};
function vPlan(){
 if(!cur)return `<div class="card"><h2>📝 التحضير</h2><p class="mu">أنشئ خطة درس، ثم صدّرها بقالب وزارة التربية (Word) أو PDF.</p><button class="btn" data-new>➕ خطة جديدة</button></div>`+
 (plans.length?`<div class="card"><h2>خططك المحفوظة (${plans.length})</h2>${plans.slice().sort((a,b)=>b.ts-a.ts).map(p=>`<div class="it"><b>${esc(p.title||'(بلا عنوان)')}</b><div class="mu">${esc(p.subject)} ${p.grade?'· صف '+esc(p.grade):''} ${p.section?'· شعبة '+esc(p.section):''} · ${esc(p.date)}</div><div class="row"><button class="btn g" data-open="${p.id}">فتح</button><button class="btn g" data-dup="${p.id}">نسخ</button><button class="btn r" data-del="${p.id}" style="flex:0">🗑️</button></div></div>`).join('')}</div>`:'');
 const c=cur,mins=MIN[c.dur]||MIN[45];
 const chk=k=>`<label class="l">${OPTN[k]}</label><div class="chk">${OPT[k].map(o=>`<label><input type="checkbox" data-c="${k}" value="${esc(o)}" ${((c.chk[k]||[]).includes(o))?'checked':''}><span>${esc(o)}</span></label>`).join('')}</div>`;
 return `<button class="btn g" data-back>← الخطط</button>
 <details open><summary>البيانات الأساسية</summary><div>${fld('teacher','المعلم')}${fld('subject','المادة')}
 <div class="row"><div><label class="l">الصف</label><select data-k="grade"><option value=""></option>${[9,10,11,12].map(g=>`<option ${String(c.grade)===String(g)?'selected':''}>${g}</option>`).join('')}</select></div><div><label class="l">المسار</label><select data-k="track"><option value=""></option><option value="عام" ${c.track==='عام'?'selected':''}>عام</option><option value="متقدم" ${c.track==='متقدم'?'selected':''}>متقدم</option></select></div><div><label class="l">الشعبة</label><input data-k="section" value="${esc(c.section)}"></div></div>
 <div class="row"><div><label class="l">التاريخ</label><input type="date" data-k="date" value="${esc(c.date)}"></div><div><label class="l">مدة الحصة (دقيقة)</label><select data-k="dur">${[35,40,45,50,60].map(d=>`<option ${+c.dur===d?'selected':''}>${d}</option>`).join('')}</select></div></div>
 ${fld('title','عنوان الدرس')}${fld('unit','عنوان الوحدة')}${fld('secTitle','عنوان القسم أو الموضوع (اختياري)')}</div></details>
 <details><summary>المنهج والموارد</summary><div>${fld('outcomes','نواتج التعلم (سطر لكل ناتج)','',1)}${fld('prior','المعرفة السابقة','',1)}${fld('objectives','أهداف القسم (سطر لكل هدف)','',1)}${fld('misc','المفاهيم الخاطئة المحتملة','',1)}${fld('vocab','المفردات (سطر لكل مفردة: المفردة — معناها)','',1)}${fld('uae','الربط بدولة الإمارات','',1)}${fld('resources','الموارد التعليمية','',1)}${fld('materials','المواد والأدوات','',1)}${fld('questions','الأسئلة الرئيسة (سطر لكل سؤال)','',1)}</div></details>
 <details><summary>المهارات والكفاءات (اختيار)</summary><div>${Object.keys(OPTN).map(chk).join('')}</div></details>
 <details><summary>مراحل الحصة (${c.dur} دقيقة)</summary><div>${PH.map((p,i)=>`<div class="it"><b>${i+1}. ${p[1]}</b> <span class="tag">${mins[i]} د</span>${fld('ph.'+i+'.t','إجراء المعلم','',1)}${fld('ph.'+i+'.l','نشاط المتعلم')}${fld('ph.'+i+'.s','الاستراتيجية')}${fld('ph.'+i+'.q','سؤال محوري')}${fld('ph.'+i+'.e','دليل النجاح')}</div>`).join('')}</div></details>
 <details><summary>التقويم والدعم</summary><div>${fld('as.d','التقييم القبلي','',1)}${fld('as.f','التقييم التكويني','',1)}${fld('as.p','مهمة أداء')}${fld('as.w','نشاط كتابي')}${fld('as.q','اختبار قصير')}${fld('as.s','التقييم التحصيلي')}${fld('lang','دعم اللغة','',1)}${fld('diff','التدريس المتمايز','',1)}${fld('hw','الواجب المنزلي','',1)}${fld('support','الطلبة المستهدفون والدعم (أصحاب الهمم والموهوبون)','',1)}<label class="l">ترتيب جلوس الطلبة</label><select data-k="seat"><option value=""></option>${OPT.seatingArrangement.map(o=>`<option ${c.seat===o?'selected':''}>${o}</option>`).join('')}</select>${fld('refl','سؤال التأمل بعد التنفيذ','',1)}${fld('next','الخطوة التالية','',1)}</div></details>
 <div class="card"><h2>✨ تحضير بالذكاء الاصطناعي (اختياري)</h2><p class="mu">يجهّز نصاً من بيانات الدرس الأساسية، تلصقه في Claude أو Gemini أو ChatGPT، ثم تعيد الرد هنا فتُملأ الخانات. لا يُرسل التطبيق شيئاً بنفسه.</p><div class="row"><button class="btn" data-ai>✨ تجهيز النص</button><button class="btn g" data-aipaste>📥 لصق رد الذكاء الاصطناعي</button></div></div>
 <div class="card"><div class="row"><button class="btn" data-word>📘 تصدير Word</button><button class="btn g" data-pdf>📄 PDF / طباعة</button></div><button class="btn g" data-save style="width:100%">💾 حفظ الخطة</button><button class="btn g" data-back style="width:100%;margin-top:8px">← رجوع إلى الخطط</button><p class="mu">ملف Word يملأ قالب الوزارة نفسه. وفي ملف PDF اختر «حفظ في الملفات» من قائمة المشاركة.</p></div>`}
function vSoon(t,d){return `<div class="card"><h2>${t}</h2><p class="mu">${d}</p><p class="mu">هذا القسم قيد البناء، وسيأتي في المرحلة التالية.</p></div>`}
function render(){nav();$('#m').innerHTML=tab==='plan'?vPlan():tab==='test'?vSoon('📄 الاختبارات','إعداد الأسئلة وتصدير ورقة الاختبار Word وPDF.'):vSoon('🤝 الخطة العلاجية وأصحاب الهمم','الخطة العلاجية الفردية وتكييفات أصحاب الهمم.')}
document.addEventListener('input',e=>{const k=e.target.dataset&&e.target.dataset.k;if(k&&cur){setv(k,e.target.value)}});
document.addEventListener('change',e=>{const t=e.target;if(t.dataset&&t.dataset.c&&cur){const k=t.dataset.c;cur.chk[k]=[...document.querySelectorAll(`input[data-c="${k}"]:checked`)].map(x=>x.value)}
 if(t.dataset&&t.dataset.k==='dur'&&cur){render()}});
function persist(){if(!cur)return;const i=plans.findIndex(p=>p.id===cur.id);cur.ts=Date.now();if(i<0)plans.push(cur);else plans[i]=cur;SV('ms_zone_plans',plans);SV('ms_zone_prof',{teacher:cur.teacher,subject:cur.subject})}
document.addEventListener('click',async e=>{const b=e.target.closest('button');if(!b)return;const d=b.dataset;
 if(d.new!=null){cur=blank();history.pushState({z:1},'');render();scrollTo(0,0)}
 else if(d.open){cur=JSON.parse(JSON.stringify(plans.find(p=>p.id===d.open)));history.pushState({z:1},'');render();scrollTo(0,0)}
 else if(d.dup){const p=JSON.parse(JSON.stringify(plans.find(p=>p.id===d.dup)));p.id=uid();p.title+=' (نسخة)';plans.push(p);SV('ms_zone_plans',plans);render()}
 else if(d.del){if(confirm('حذف الخطة؟')){plans=plans.filter(p=>p.id!==d.del);SV('ms_zone_plans',plans);render()}}
 else if(d.back!=null){if(history.state&&history.state.z===1)history.back();else{persist();cur=null;render();scrollTo(0,0)}}
 else if(d.save!=null){persist();alert('تم حفظ الخطة')}
 else if(d.word!=null){persist();try{await exportWord(cur)}catch(err){console.error(err);alert('تعذر إنشاء ملف Word: '+(err&&err.message||err))}}
 else if(d.pdf!=null){persist();history.pushState({z:2},'');showPrint(cur)}
 else if(d.ai!=null)aiDialog();
 else if(d.aipaste!=null)aiPaste();
 else if(d.aiapp){const tx=aiPrompt(cur);let ok=false;try{await navigator.clipboard.writeText(tx);ok=true}catch(e){}if(!ok){const ta=$('#aitx');if(ta){ta.select();try{document.execCommand('copy');ok=true}catch(e){}}}alert(ok?'تم نسخ النص. الصقه في محادثة '+b.dataset.nm+' (اضغط مطولاً ثم «لصق»).':'تعذر النسخ تلقائياً. حدد النص بالأسفل وانسخه يدوياً.');window.open(d.aiapp,'_blank')}
});
/* ===== الذكاء الاصطناعي (اختياري) ===== */
function aiPrompt(p){const mins=MIN[p.dur]||MIN[45];
 const cl=k=>OPT[k].map(x=>'"'+x+'"').join('، ');
 return `أنت خبير مناهج ومعلم متمرس في مدارس دولة الإمارات العربية المتحدة (وزارة التربية والتعليم). المطلوب: إعداد خطة درس يومية جاهزة للتنفيذ باللغة العربية الفصحى المبسطة.

بيانات الدرس:
- المادة: ${p.subject||'—'}
- الصف: ${p.grade||'—'} | المسار: ${p.track||'—'}
- عنوان الوحدة: ${p.unit||'—'}
- عنوان القسم/الموضوع: ${p.secTitle||'—'}
- عنوان الدرس: ${p.title||'—'}
- مدة الحصة: ${p.dur} دقيقة (توزيع المراحل الخمس بالدقائق: ${mins.join(' + ')})

قواعد صارمة:
1. لا يتوفر كتاب الطالب ولا دليل المعلم: لا تختلق أرقام صفحات ولا نصوصاً أو أنشطة منسوبة إلى الكتاب. اكتب موارد عامة (مثل: كتاب الطالب، محاكاة تفاعلية، فيديو قصير) دون أرقام صفحات.
2. اعتمد على المفاهيم العلمية المستقرة المعروفة لهذا الموضوع في هذا الصف، وتحرَّ الدقة العلمية، ولا تضع معلومات لست متأكداً منها.
3. لا تذكر أسماء طلاب أو بيانات شخصية.
4. استخدم الأرقام الغربية (0123456789) فقط.
